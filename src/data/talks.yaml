apiVersion: reversegitops.dev/v1alpha1
kind: Talk
metadata:
  name: gitops-reinvented-kubernetes-drift
spec:
  speaker: Damien Dassieu
  event: Dutch Cloud Native Day 2025
  date: 2025-07-03
  place: Jaarbeurs, Utrecht
  title: "GitOps Reinvented: Correcting Kubernetes Drift Before It Happens"
  abstract:
    - >-
      GitOps has become a foundational practice in Kubernetes environments, offering a
      declarative, version-controlled approach to infrastructure and application management.
      Yet, real-world cluster interactions often rely on imperative tools like kubectl, oc,
      or web UIs that provide faster feedback loops and a more intuitive user experience.
    - >-
      These imperative tools validate and send requests directly to the Kubernetes API
      server, but their actions typically bypass Git, creating gaps in visibility,
      reproducibility, and auditability.
    - >-
      So how can we bridge this gap? This talk introduces a new way to align imperative
      workflows with GitOps by intercepting kube-api requests and transforming them into Git
      commits. We’ll explore how Syngit integrates seamlessly with GitOps tools such as
      ArgoCD or FluxCD to preserve Git as the source of truth even when users interact with
      clusters imperatively.
    - >-
      We'll walk through practical use cases where this approach unlocks better visibility,
      stronger auditing, and safer infrastructure workflows without forcing users to abandon
      the tools they already know and love.
  slides: /Damien-Dassieu-KCD-Utrecht.pdf
  links:
    - label: Syngit on GitHub
      href: https://github.com/syngit-org/syngit
    - label: DCND 2025 schedule
      href: https://www.dutchcloudnativeday.nl/2025/schedule/
---
apiVersion: reversegitops.dev/v1alpha1
kind: Talk
metadata:
  name: gitops-reinvented-capi-poster
spec:
  speaker: Damien Dassieu
  event: KubeCon + CloudNativeCon Europe 2025 · Poster Session
  date: 2025-04-03
  place: London
  title: "GitOps Reinvented: Leveraging Imperative Tools for CAPI Clusters Management"
  abstract:
    - >-
      The GitOps approach has become a cornerstone of Kubernetes workflows, offering a
      declarative way to manage infrastructure and applications. However, managing
      infrastructure like Kubernetes clusters with GitOps presents challenges. For instance,
      large and complex CAPI manifests can lead to misconfigurations with unintended
      consequences.
    - >-
      To address this, platform engineers can use tools like kubectl, oc, or web UIs for an
      imperative, user-friendly experience. These tools validate inputs before sending
      requests to the Kubernetes API server, reducing errors.
    - >-
      But how can we integrate GitOps principles while using these tools? This session
      explores how ArgoCD & Syngit enable GitOps workflows for CAPI cluster management,
      combining declarative and imperative approaches for better results.
  poster:
    src: /Damien-Dassieu-GitOps-Reinvented.jpg
    width: 3840
    height: 2160
    alt: >-
      Poster for GitOps Reinvented. A user creates a Crossplane CustomCluster with any client
      tool, Syngit intercepts the request and commits the YAML to Git, and Argo CD or Flux
      turns it into a CAPI workload cluster.
  links:
    - label: Syngit on GitHub
      href: https://github.com/syngit-org/syngit
    - label: Session page
      href: https://kccnceu2025.sched.com/event/1txDi
