# Talks shown on /talks. Order does not matter: the page sorts by date and puts a
# talk under Upcoming until the day it is given (decided at build time).
#
# Each talk is a Kubernetes-style object (kind: Talk), the same shape that tools
# writing Kubernetes resources to Git, such as gitops-reverser, produce.
#
#   metadata.name  anchor for direct links: reversegitops.dev/talks/#<name> (keep it stable)
#
# Fields under spec:
#
#   date      YYYY-MM-DD
#   schedule  time and room, only shown while the talk is upcoming
#   virtual   true shows a globe instead of a map pin
#   youtube   video id; embeds the video and adds "Watch on YouTube →"
#   slides    URL of the slide deck; adds a "Slides" button
#   poster    image shown inline plus a "Poster" button
#   links     extra links; the first one is the main button when there is no
#             video, slides or poster

